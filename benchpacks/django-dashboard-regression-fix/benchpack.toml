[pack]
id = "django-dashboard-regression-fix"
version = "0.1.0"
description = "Multi-file repo-task pack that fixes a stdlib dashboard visibility and ordering regression"

[defaults]
temperature = 0
max_tokens = 1200
stream = false
warmup = 0
repetitions = 1

[[fixtures]]
id = "repo"
kind = "repo"
path = "fixtures/repo"
description = "Stdlib-only dashboard-shaped Python repo with intentional regressions"

[[cases]]
id = "fix-dashboard-regressions"
kind = "repo-task"
prompt_file = "prompts/fix-dashboard-regressions.md"
fixture_refs = ["repo"]
scoring = { mode = "verify-script", script = "verify/check.py" }
