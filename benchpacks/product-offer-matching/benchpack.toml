[pack]
id = "product-offer-matching"
version = "0.1.0"
description = "Direct-edit coding-agent benchmark for PriceRunner product-offer clustering in Python and Rust"

[defaults]
temperature = 0
max_tokens = 64
stream = false
warmup = 0
repetitions = 1

[[fixtures]]
id = "matcher-repo"
kind = "repo"
path = "fixtures/matcher-repo"
description = "PriceRunner-derived product-offer clustering repo fixture"

[[cases]]
id = "cluster-pricerunner-python"
kind = "repo-task"
prompt_file = "prompts/cluster-pricerunner-python.md"
fixture_refs = ["matcher-repo"]
harness = { id = "external-agent", timeout_s = 3600 }
scoring = { mode = "verify-script", script = "verify/score_clusters.py", timeout_s = 90 }

[[cases]]
id = "cluster-pricerunner-rust"
kind = "repo-task"
prompt_file = "prompts/cluster-pricerunner-rust.md"
fixture_refs = ["matcher-repo"]
harness = { id = "external-agent", timeout_s = 3600 }
scoring = { mode = "verify-script", script = "verify/score_clusters.py", timeout_s = 90 }
