[pack]
id = "python-regression-fix-external-agent"
version = "0.1.1"
description = "Direct-edit external-agent variant of python-regression-fix using the same fixture and verifier"

[defaults]
temperature = 0
max_tokens = 768
stream = false
warmup = 0
repetitions = 1

[[fixtures]]
id = "repo"
kind = "repo"
path = "fixtures/repo"
description = "Small Python task-summary repo with intentional regressions"

[[cases]]
id = "fix-task-summary"
kind = "repo-task"
prompt_file = "prompts/fix-task-summary.md"
fixture_refs = ["repo"]
harness = { id = "external-agent", timeout_s = 900 }
scoring = { mode = "verify-script", script = "verify/check.py" }
